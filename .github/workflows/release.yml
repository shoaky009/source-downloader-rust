name: Release

on:
  push:
    tags:
      - "source-downloader-*-v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      package: ${{ steps.release.outputs.package }}
      binary: ${{ steps.release.outputs.binary }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      revision: ${{ steps.range.outputs.revision }}
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Parse and validate tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^(source-downloader-[A-Za-z0-9_-]+)-v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]]; then
            release_name="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          short_name="${release_name#source-downloader-}"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          matches="$(jq -c --arg exact "$release_name" --arg short "$short_name" \
            '[.packages[] | select(.name == $exact or .name == $short)]' <<<"$metadata")"
          match_count="$(jq -r 'length' <<<"$matches")"
          if [[ "$match_count" != "1" ]]; then
            echo "Tag $RELEASE_TAG must resolve to exactly one workspace package; found $match_count" >&2
            exit 1
          fi

          package_metadata="$(jq -c '.[0]' <<<"$matches")"
          package="$(jq -r '.name' <<<"$package_metadata")"
          manifest_version="$(jq -r '.version' <<<"$package_metadata")"
          if [[ "$manifest_version" != "$version" ]]; then
            echo "Tag version $version does not match $package version $manifest_version" >&2
            exit 1
          fi

          binary_count="$(jq -r \
            '[.targets[] | select(.kind | index("bin"))] | length' \
            <<<"$package_metadata")"
          binary=""
          if [[ "$binary_count" == "1" ]]; then
            kind="application"
            binary="$(jq -r \
              '.targets[] | select(.kind | index("bin")) | .name' \
              <<<"$package_metadata")"
          elif [[ "$binary_count" == "0" ]]; then
            if [[ "$(jq -r '.publish == []' <<<"$package_metadata")" == "true" ]]; then
              echo "Package $package has publish = false and no binary target" >&2
              exit 1
            fi
            kind="crate"
          else
            echo "Application package $package must have exactly one binary target; found $binary_count" >&2
            exit 1
          fi

          printf 'kind=%s\n' "$kind" >>"$GITHUB_OUTPUT"
          printf 'package=%s\n' "$package" >>"$GITHUB_OUTPUT"
          printf 'binary=%s\n' "$binary" >>"$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Select package release range
        id: range
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_name="${RELEASE_TAG%-v*}"
          if previous_tag="$(git describe --tags --match "$release_name-v*" \
            --abbrev=0 "$GITHUB_SHA^" 2>/dev/null)"; then
            echo "revision=$previous_tag..$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          else
            echo "revision=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          fi

  binaries:
    name: Build ${{ matrix.target }}
    if: needs.metadata.outputs.kind == 'application'
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable_suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build application binary
        shell: bash
        env:
          PACKAGE: ${{ needs.metadata.outputs.package }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --package "$PACKAGE" --bins --target "$TARGET"

      - name: Stage release binary
        shell: bash
        env:
          BINARY: ${{ needs.metadata.outputs.binary }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          source="target/$TARGET/release/${BINARY}${EXECUTABLE_SUFFIX}"
          destination="dist/${BINARY}-${VERSION}-${TARGET}${EXECUTABLE_SUFFIX}"
          mkdir -p dist
          cp "$source" "$destination"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build web container image
    if: needs.metadata.outputs.kind == 'application' && needs.metadata.outputs.package == 'web'
    needs:
      - metadata
      - binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Linux release binaries
        uses: actions/download-artifact@v7
        with:
          pattern: binary-*-unknown-linux-gnu
          path: release-binaries
          merge-multiple: true

      - name: Stage container binaries
        shell: bash
        env:
          BINARY: ${{ needs.metadata.outputs.binary }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          install -D -m 0755 \
            "release-binaries/${BINARY}-${VERSION}-x86_64-unknown-linux-gnu" \
            "container-binaries/amd64/source-downloader-web"
          install -D -m 0755 \
            "release-binaries/${BINARY}-${VERSION}-aarch64-unknown-linux-gnu" \
            "container-binaries/arm64/source-downloader-web"

      - name: Configure image repository and tags
        id: image
        shell: bash
        env:
          DOCKER_IMAGE_PREFIX: ${{ vars.DOCKER_IMAGE_PREFIX }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          prefix="${DOCKER_IMAGE_PREFIX%/}"
          if [[ ! "$prefix" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+$ ]]; then
            echo "DOCKER_IMAGE_PREFIX must include a registry and namespace, for example ghcr.io/acme" >&2
            exit 1
          fi

          image="$prefix/web"
          registry="${prefix%%/*}"
          {
            printf 'registry=%s\n' "$registry"
            echo 'tags<<EOF'
            printf '%s:%s\n' "$image" "$VERSION"
            if [[ "$PRERELEASE" == "false" ]]; then
              printf '%s:latest\n' "$image"
            fi
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"


      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ vars.DOCKER_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=web-release
          cache-to: type=gha,mode=max,scope=web-release

  publish:
    name: Publish crate
    if: needs.metadata.outputs.kind == 'crate'
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Publish crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGE: ${{ needs.metadata.outputs.package }}
        run: cargo publish --locked --package "$PACKAGE"

  release-application:
    name: Create application release
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.metadata.outputs.kind == 'application' &&
      needs.binaries.result == 'success' &&
      (needs.container.result == 'success' || needs.container.result == 'skipped')
    needs:
      - metadata
      - binaries
      - container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download binary artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Generate complete changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: dist/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          config: cliff.toml
          args: --verbose --strip header --tag "${{ github.ref_name }}" ${{ needs.metadata.outputs.revision }}
        env:
          OUTPUT: dist/RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.metadata.outputs.binary }} v${{ needs.metadata.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/${{ needs.metadata.outputs.binary }}-${{ needs.metadata.outputs.version }}-x86_64-unknown-linux-gnu
            dist/${{ needs.metadata.outputs.binary }}-${{ needs.metadata.outputs.version }}-aarch64-unknown-linux-gnu
            dist/${{ needs.metadata.outputs.binary }}-${{ needs.metadata.outputs.version }}-x86_64-pc-windows-msvc.exe
            dist/CHANGELOG.md

  release-crate:
    name: Create crate release
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.metadata.outputs.kind == 'crate' &&
      needs.publish.result == 'success'
    needs:
      - metadata
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate complete changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: dist/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          config: cliff.toml
          args: --verbose --strip header --tag "${{ github.ref_name }}" ${{ needs.metadata.outputs.revision }}
        env:
          OUTPUT: dist/RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.metadata.outputs.package }} v${{ needs.metadata.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: dist/CHANGELOG.md
