[changelog]
header = """
# Changelog

All notable changes are generated from Conventional Commits.
"""
body = """
{% if version %}\
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = '^source-downloader-[A-Za-z0-9_-]+-v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$'
sort_commits = "oldest"
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking Changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^(refactor|perf|docs|revert)", group = "<!-- 2 -->Changed" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = "^(build|chore|ci|style|test)", skip = true },
]
