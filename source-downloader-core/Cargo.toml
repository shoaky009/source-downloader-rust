[package]
name = "source-downloader-core"
version = "0.1.0"
edition = "2024"

[dependencies]
source-downloader-sdk = { path = "../source-downloader-sdk" }
libloading = { workspace = true }
serde_yaml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
moka = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
cel = { workspace = true, features = ["chrono", "json"] }
humantime = { workspace = true }
iso8601-duration = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-cron-scheduler = { workspace = true }
async-trait = { workspace = true }
backon = { workspace = true }
futures-util = { workspace = true, features = ["std", "async-await"] }
indexmap = { workspace = true, features = ["serde"] }
walkdir = { workspace = true }
url = { workspace = true, features = ["std"] }
#rkyv = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
zstd = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "system-proxy", "stream"] }
itertools = { workspace = true }
fastmurmur3 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
storage-memory = { path = "../storage-memory" }
storage-sqlite = { path = "../storage-sqlite" }
source-downloader-sdk = { path = "../source-downloader-sdk", features = ["test"] }
maplit = { workspace = true }
criterion = { workspace = true }
vfs = { workspace = true }
jsonpath-rust = { workspace = true }
mockall = { workspace = true }
http-serde = { workspace = true }
tracing-test = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "filter"
harness = false

[[bench]]
name = "source_processor_execute"
harness = false

[[bench]]
name = "force_trimmer"
harness = false

[[bench]]
name = "full_width_replacer"
harness = false

[[bench]]
name = "regex_trimmer"
harness = false

[[bench]]
name = "regex_variable_provider"
harness = false