instances:
- name: test
  props:
    test: test_value
components:
  trigger:
  - name: 20min
    type: fixed
    props:
      interval: PT10S
  source:
  - name: test
    type: system-file
    props:
      path: test_value
  - name: sync_downloader_case
    type: mock
    props:
      fetch:
      - returning: Ok
        value:
        - source-item:
            download-uri: file://sync_downloader_case/1.txt
            link: file://sync_downloader_case/1.txt
            title: 1.txt
        - source-item:
            download-uri: file://sync_downloader_case/2.txt
            link: file://sync_downloader_case/2.txt
            title: 2.txt
        - source-item:
            download-uri: file://sync_downloader_case/source/3.txt
            link: file://sync_downloader_case/source/3.txt
            title: 3.txt
        - source-item:
            title: filter.txt
        - source-item:
            download-uri: file://sync_downloader_case/source/conflict
            link: file://sync_downloader_case/source/conflict
            title: conflict
  - name: flow_ctr_retry_then_ok
    type: mock
    props:
      fetch:
      - opt:
          once: true
          retryable: true
          return-once: true
        returning: Err
      - returning: Ok
        value: []
  - name: fetch_retry_exhausted
    type: mock
    props:
      fetch:
      - returning: Err
        opt:
          once: false
          return-once: false
          retryable: true
  - name: metadata-smoke
    type: system-file
    props:
      path: .
  item-file-resolver:
  - name: test
    type: system-file
    props: {}
  downloader:
  - name: http
    type: http
    props:
      download-path: /tmp
  file-mover:
  - name: system-file
    type: system-file
    props: {}
processors:
- name: normal-case
  enabled: true
  save-path: test1
  triggers: []
  source: system-file:test
  item-file-resolver: system-file:test
  downloader: http
  file-mover: system-file
  options:
    download-options: {}
- name: sync_downloader_case
  enabled: true
  save-path: test1
  triggers: []
  source: mock:sync_downloader_case
  item-file-resolver: vfs
  downloader: mock:sync_downloader_case
  file-mover: mock:sync_downloader_case
  options:
    item-expression-exclusions:
    - item.title == 'filter.txt'
    rename-task-interval: PT15M
    rename-times-threshold: 5
    item-error-continue: true
    item-grouping:
    - tags: null
      expression-matching: item.title == '1.txt'
      filename-pattern: null
      save-path-pattern: test001
      variable-providers: []
      source-item-filters: null
      item-expression-exclusions: []
      item-expression-inclusions: []
    - tags: null
      expression-matching: item.title.contains('conflict')
      filename-pattern: conflict
      save-path-pattern: null
      variable-providers: null
      source-item-filters: null
      item-expression-exclusions: null
      item-expression-inclusions: null
    file-grouping:
    - tags: null
      expression-matching: file.path.contains('.ass')
      filename-pattern: ''
      save-path-pattern: null
      file-content-filters: []
      file-content-expression-exclusions: null
      file-content-expression-inclusions: null
    download-options: {}
  category: test
  tags:
  - auto
  - test
- name: flow_ctr_retry_then_ok
  enabled: true
  save-path: test
  triggers: []
  source: mock:flow_ctr_retry_then_ok
  item-file-resolver: vfs
  downloader: mock:sync_downloader_case
  file-mover: mock:sync_downloader_case
  options:
    retry-backoff: PT0S
  category: test
- name: fetch_retry_exhausted
  enabled: true
  save-path: test
  triggers: []
  source: mock:fetch_retry_exhausted
  item-file-resolver: vfs
  downloader: mock:sync_downloader_case
  file-mover: mock:sync_downloader_case
  options:
    retry-attempts: 1
    retry-backoff: PT0S
    download-options: {}
