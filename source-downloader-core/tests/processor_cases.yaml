sync_downloader_case:
  files:
    - path: "1.txt"
      content: "hello"
    - path: "2.txt"
    - path: "source/3.txt"
    - path: "filter.txt"
    - path: conflict
  assertions:
    - select: "$"
      asserts:
        - length: 4
    - select: "$[*]"
      asserts:
        - path: ".status"
          equals: "Renamed"
    - select: "$[?(@.itemContent.sourceItem.title == '1.txt')]"
      asserts:
        - path: ".files"
          length: 1
        - pointer: "/files/0/targetSavePath"
          path-equals: test1/test001
    - select: "$[?(@.itemContent.sourceItem.title == '2.txt')]"
      asserts:
        - pointer: "/files/0/targetSavePath"
          path-equals: test1/
    - select: "$[?(@.itemContent.sourceItem.title == 'conflict')]"
      asserts:
        - pointer: "/files/0/status"
          equals: FileConflict
        - pointer: "/files/1/status"
          equals: FileConflict

flow_ctr_retry_then_ok: {}

fetch_retry_exhausted:
  expected-run-error: Mock retryable
  assertions:
    - select: "$[*]"
      exact-count: 0
      asserts: []