[package]
name = "source-downloader-sdk"
version = "0.1.0"
edition = "2024"


[features]
test = []
http-client = ["dep:reqwest", "dep:rustls", "dep:rustls-platform-verifier"]
plugin-runtime = ["dep:tokio"]

[dependencies]
reqwest = { workspace = true, features = ["rustls", "http2"], optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
http = { workspace = true }
http-serde = { workspace = true }
time = { workspace = true, features = ["serde", "parsing", "formatting", "macros"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_path_to_error = { workspace = true }
component-macro = { path = "../component-macro" }
parking_lot = { workspace = true, features = ["serde"] }
async-trait = { workspace = true }
fastmurmur3 = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, optional = true }
#derivative = { workspace = true}

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
